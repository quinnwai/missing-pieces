<title>__GUIDE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: liner notes for a conversation. One reading column, a sticky "I'm at" bar,
   and a timeline whose left gutter is the timestamp you tap to jump into the video. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --fg: #16181E;
  --muted: #596072;
  --rule: #D6DAE2;
  --accent: #2443C2;
  --on-accent: #FFFFFF;
  --hl: #FFF2B8;
  --ok: #1D7A45;
  --ok-soft: #DCF0E3;
  --warn: #875C00;
  --warn-soft: #FAEDCB;
  --bad: #B3302A;
  --bad-soft: #F8DFDC;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191C23; --fg: #E8EAF0; --muted: #9CA3B5; --rule: #2B303C;
    --accent: #95A9FF; --on-accent: #0E1220; --hl: #353015;
    --ok: #5CC98B; --ok-soft: #16301F; --warn: #E9B64B; --warn-soft: #34290E; --bad: #FF8A7B; --bad-soft: #3B1B18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191C23; --fg: #E8EAF0; --muted: #9CA3B5; --rule: #2B303C;
  --accent: #95A9FF; --on-accent: #0E1220; --hl: #353015;
  --ok: #5CC98B; --ok-soft: #16301F; --warn: #E9B64B; --warn-soft: #34290E; --bad: #FF8A7B; --bad-soft: #3B1B18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 44rem; margin-inline: auto; padding-inline: 16px; }
.mono { font-family: var(--font-mono); }

/* Sticky bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding-block: 10px; }
.mark { font-family: var(--font-display); font-weight: 800; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; }
.mark span { color: var(--accent); }
.jump { display: flex; align-items: center; gap: 8px; margin: 0; }
.jump label { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.jump input {
  width: 5.5rem; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--fg);
  font: 500 1rem var(--font-mono); font-variant-numeric: tabular-nums;
}
.btn {
  font: 500 .82rem var(--font-mono); padding: 7px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
}
.jump-status { flex-basis: 100%; margin: 0; font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* Header */
.top { display: grid; gap: 10px; padding-block: 28px 20px; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(1.9rem, 6.5vw, 2.8rem); line-height: 1.02; letter-spacing: .005em; text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.note { margin: 0; padding: 10px 12px; border-radius: 8px; font-size: .92rem; }
.note.sample { border: 1px solid var(--warn); background: var(--warn-soft); }
.note.captions { border: 1px solid var(--rule); background: var(--surface); }

/* Sections */
section { padding-block: 22px; border-top: 1px solid var(--rule); }
h2 {
  display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px;
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .05em; text-transform: uppercase;
}
h2 .count { font-family: var(--font-mono); font-weight: 400; font-size: .78rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.subhead { margin: 18px 0 8px; font-family: var(--font-mono); font-weight: 500; font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.summary { margin: 0 0 18px; font-size: 1.06rem; max-width: 65ch; }

.speakers { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
.speaker { display: grid; gap: 4px; min-width: 0; }
.speaker-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.speaker-name { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.1; }
.role { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.who { margin: 0; }
.facts { display: grid; grid-template-columns: 6.25rem minmax(0, 1fr); gap: 2px 12px; margin: 2px 0 0; }
.facts dt { padding-top: .25em; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; }
.relationships { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; }

/* Legend and filters */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 14px; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); }
.legend li { display: flex; align-items: baseline; gap: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip {
  font: .76rem var(--font-mono); padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--surface); color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip .n { margin-left: 4px; opacity: .65; }

/* Confidence pill */
.conf {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 999px;
  font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
}
.conf::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.conf.green { color: var(--ok); background: var(--ok-soft); }
.conf.yellow { color: var(--warn); background: var(--warn-soft); }
.conf.red { color: var(--bad); background: var(--bad-soft); }

/* Timeline */
.timeline { margin: 0; padding: 0; list-style: none; }
.entry {
  display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: 0 14px;
  padding-block: 18px; border-top: 1px solid var(--rule);
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px);
}
.timeline > .entry:first-child, .chapter + .entry { border-top: 0; }
.entry.current { background: var(--hl); box-shadow: 0 0 0 10px var(--hl); border-radius: 2px; }
.ts {
  padding-top: .3em; font: 500 .9rem var(--font-mono); font-variant-numeric: tabular-nums;
  color: var(--accent); text-decoration: none;
}
a.ts:hover { text-decoration: underline; }
.entry-body { display: grid; gap: 7px; min-width: 0; }
.entry-name { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1.08; text-wrap: balance; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.cat { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.field { margin: 0; max-width: 65ch; }
.field b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.field.why b { color: var(--accent); }
.heard { margin: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: .82rem; }
.also { margin: 0; font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.also a { margin-left: 6px; }
.chapter {
  display: flex; align-items: baseline; gap: 12px; padding-block: 16px 2px; margin-top: 8px;
  border-top: 2px solid var(--fg);
}
.chapter-title { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; }
.empty { padding-block: 18px; color: var(--muted); }

footer { padding-block: 22px 40px; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }

@media (max-width: 420px) {
  .entry { grid-template-columns: 3.7rem minmax(0, 1fr); gap: 0 10px; }
  .facts { grid-template-columns: 1fr; }
  .facts dt { padding-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<div class="bar">
  <div class="wrap">
    <div class="mark">Missing <span>Pieces</span></div>
    <form class="jump" id="jump" autocomplete="off">
      <label for="jump-time">I'm at</label>
      <input id="jump-time" name="jump-time" inputmode="numeric" placeholder="23:10" aria-describedby="jump-status">
      <button class="btn" type="submit">Go</button>
    </form>
    <p class="jump-status" id="jump-status" aria-live="polite" hidden></p>
  </div>
</div>

<main class="wrap">
  <header class="top">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <p class="note sample" id="notice" hidden></p>
    <p class="note captions" id="captions-note" hidden></p>
  </header>

  <section aria-labelledby="people-h">
    <h2 id="people-h">People and relationships</h2>
    <p class="summary" id="summary"></p>
    <ul class="speakers" id="speakers"></ul>
    <h3 class="subhead" id="rel-h" hidden>How they're connected</h3>
    <ul class="relationships" id="relationships" aria-labelledby="rel-h"></ul>
  </section>

  <section aria-labelledby="refs-h">
    <h2 id="refs-h">References <span class="count" id="ref-count"></span></h2>
    <ul class="legend">
      <li><span class="conf green">Checked</span> name and facts confirmed</li>
      <li><span class="conf yellow">Best guess</span> captions unclear or link inferred</li>
      <li><span class="conf red">Unconfirmed</span> listen back to check</li>
    </ul>
    <div class="filters" id="filters" role="group" aria-label="Filter references"></div>
    <ol class="timeline" id="timeline"></ol>
    <p class="empty" id="empty" hidden>No references match this filter.</p>
  </section>

  <footer id="footer"></footer>
</main>

<script id="guide-data" type="application/json">__GUIDE_DATA__</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("guide-data").textContent);
  var video = data.video || {};
  var people = data.people || {};
  var entries = (data.entries || []).slice().sort(function (a, b) { return a.t - b.t; });
  var chapters = (data.chapters || []).slice().sort(function (a, b) { return a.start - b.start; });

  var CAT = { music: "Music", people: "People", places: "Places", history: "History", culture: "Culture",
              slang: "Slang", "inside-joke": "Inside joke", other: "Other" };
  var CONF = { green: "Checked", yellow: "Best guess", red: "Unconfirmed" };
  var lastT = Math.max(video.duration || 0, entries.length ? entries[entries.length - 1].t : 0);
  var longForm = lastT >= 3600;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var storeKey = "missing-pieces:" + (video.id || "guide");

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(t) {
    t = Math.max(0, Math.floor(t));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return longForm ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
  }
  function parseTime(str) {
    str = String(str || "").trim();
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10) * 60; // a bare number means minutes
    var parts = str.split(":");
    if (parts.length > 3 || parts.some(function (p) { return !/^\d+$/.test(p); })) return null;
    return parts.reduce(function (acc, p) { return acc * 60 + parseInt(p, 10); }, 0);
  }
  function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }
  function link(text, url, cls) {
    var a = el("a", cls, text);
    var u = safeUrl(url);
    if (u) { a.href = u; a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }
  function videoAt(t) {
    return video.id ? "https://www.youtube.com/watch?v=" + encodeURIComponent(video.id) + "&t=" + Math.floor(t) + "s" : null;
  }
  function tsLink(t, cls) {
    var a = link(fmt(t), videoAt(t), cls);
    a.setAttribute("aria-label", "Open the video at " + fmt(t));
    return a;
  }
  function store(value) { try { localStorage.setItem(storeKey, value); } catch (e) {} }
  function restore() { try { return localStorage.getItem(storeKey) || ""; } catch (e) { return ""; } }

  // Header
  $("eyebrow").textContent = [video.channel, video.upload_date].filter(Boolean).join(" · ");
  $("title").textContent = video.title || data.short_title || "Listening guide";
  var meta = $("meta");
  if (video.duration) meta.appendChild(el("span", null, fmt(video.duration) + " long"));
  if (video.caption_source) meta.appendChild(el("span", null, video.caption_source === "manual" ? "Manual captions" : "Auto captions"));
  if (video.id) meta.appendChild(link("Open on YouTube", videoAt(0)));
  if (data.notice) { $("notice").textContent = data.notice; $("notice").hidden = false; }
  if (video.caption_source === "auto") {
    $("captions-note").textContent = "Made from auto captions, which garble names. Yellow and red entries show what the captions heard.";
    $("captions-note").hidden = false;
  }

  // People and relationships
  $("summary").textContent = people.summary || "";
  (people.speakers || []).forEach(function (p) {
    var li = el("li", "speaker");
    var head = el("div", "speaker-head");
    head.appendChild(el("span", "speaker-name", p.name || ""));
    if (p.role) head.appendChild(el("span", "role", p.role));
    li.appendChild(head);
    if (p.who) li.appendChild(el("p", "who", p.who));
    var dl = el("dl", "facts");
    [["Stands for", p.stands_for], ["Promoting", p.promoting]].forEach(function (pair) {
      if (!pair[1]) return;
      dl.appendChild(el("dt", null, pair[0]));
      dl.appendChild(el("dd", null, pair[1]));
    });
    if (dl.children.length) li.appendChild(dl);
    $("speakers").appendChild(li);
  });
  var rels = people.relationships || [];
  rels.forEach(function (r) { $("relationships").appendChild(el("li", null, r)); });
  $("rel-h").hidden = !rels.length;

  // Timeline, with chapter dividers placed before the first entry they contain
  var timeline = $("timeline");
  var nodes = [];
  var ci = 0;
  function addChaptersUpTo(t) {
    while (ci < chapters.length && chapters[ci].start <= t) {
      var c = chapters[ci++];
      var li = el("li", "chapter");
      li.appendChild(tsLink(c.start, "ts"));
      li.appendChild(el("span", "chapter-title", c.title));
      timeline.appendChild(li);
    }
  }
  entries.forEach(function (e) {
    addChaptersUpTo(e.t);
    var li = el("li", "entry");
    li.appendChild(tsLink(e.t, "ts"));
    var body = el("div", "entry-body");
    body.appendChild(el("h3", "entry-name", e.name));
    var tags = el("div", "tags");
    tags.appendChild(el("span", "conf " + e.confidence, CONF[e.confidence] || e.confidence));
    tags.appendChild(el("span", "cat", CAT[e.category] || e.category));
    body.appendChild(tags);
    if (e.heard && e.confidence !== "green") body.appendChild(el("p", "heard", "Captions heard: “" + e.heard + "”"));
    [["what", "What it is", e.what], ["why", "Why it came up", e.why]].forEach(function (f) {
      var p = el("p", "field " + f[0]);
      p.appendChild(el("b", null, f[1]));
      p.appendChild(document.createTextNode(f[2] || ""));
      body.appendChild(p);
    });
    var links = (e.links || []).filter(function (l) { return safeUrl(l.url); });
    if (links.length) {
      var ul = el("ul", "links");
      links.forEach(function (l) { var item = el("li"); item.appendChild(link(l.label, l.url)); ul.appendChild(item); });
      body.appendChild(ul);
    }
    if (e.also_at && e.also_at.length) {
      var also = el("p", "also", "Comes up again at");
      e.also_at.forEach(function (t) { also.appendChild(tsLink(t)); });
      body.appendChild(also);
    }
    li.appendChild(body);
    timeline.appendChild(li);
    nodes.push({ e: e, li: li });
  });
  addChaptersUpTo(Infinity);

  // Filters
  var state = { cat: "all", flagged: false };
  var counts = {};
  entries.forEach(function (e) { counts[e.category] = (counts[e.category] || 0) + 1; });
  var flaggedCount = entries.filter(function (e) { return e.confidence !== "green"; }).length;
  $("ref-count").textContent = entries.length + " found";

  var filters = $("filters");
  var catButtons = [];
  function chip(label, n, pressed, onClick) {
    var b = el("button", "chip", label);
    b.type = "button";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.appendChild(el("span", "n", String(n)));
    b.addEventListener("click", onClick);
    filters.appendChild(b);
    return b;
  }
  function setCat(cat) {
    state.cat = cat;
    catButtons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.cat === cat ? "true" : "false"); });
    applyFilters();
  }
  var allBtn = chip("All", entries.length, true, function () { setCat("all"); });
  allBtn.dataset.cat = "all";
  catButtons.push(allBtn);
  Object.keys(CAT).forEach(function (cat) {
    if (!counts[cat]) return;
    var b = chip(CAT[cat], counts[cat], false, function () { setCat(cat); });
    b.dataset.cat = cat;
    catButtons.push(b);
  });
  if (flaggedCount) {
    var flagBtn = chip("Flagged only", flaggedCount, false, function () {
      state.flagged = !state.flagged;
      flagBtn.setAttribute("aria-pressed", state.flagged ? "true" : "false");
      applyFilters();
    });
  }
  function applyFilters() {
    var shown = 0;
    nodes.forEach(function (n) {
      var hide = (state.cat !== "all" && n.e.category !== state.cat) || (state.flagged && n.e.confidence === "green");
      n.li.hidden = hide;
      if (!hide) shown++;
    });
    $("empty").hidden = shown > 0;
  }

  // "I'm at" jump
  var status = $("jump-status");
  function say(msg) { status.textContent = msg; status.hidden = !msg; }
  function jumpTo(t, scroll) {
    var visible = nodes.filter(function (n) { return !n.li.hidden; });
    if (!visible.length) { say("No references to jump to with this filter."); return; }
    var current = null, next = null;
    visible.forEach(function (n) { if (n.e.t <= t) current = n; else if (!next) next = n; });
    var target = current || visible[0];
    nodes.forEach(function (n) { n.li.classList.toggle("current", n === target); });
    if (scroll) target.li.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
    var msg = "At " + fmt(t) + ". ";
    msg += current ? "Last: " + current.e.name + " (" + fmt(current.e.t) + ")." : "Nothing yet.";
    if (next) msg += " Next: " + next.e.name + " (" + fmt(next.e.t) + ").";
    say(msg);
  }
  $("jump").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var t = parseTime($("jump-time").value);
    if (t == null) { say("Type minutes like 23, or a time like 23:10."); return; }
    store($("jump-time").value.trim());
    jumpTo(t, true);
  });
  var saved = restore();
  if (saved && parseTime(saved) != null) { $("jump-time").value = saved; jumpTo(parseTime(saved), false); }

  // Footer
  var bits = [entries.length + " references"];
  if (flaggedCount) bits.push(flaggedCount + " flagged");
  if (data.generated_at) bits.push("made " + data.generated_at);
  $("footer").textContent = "Missing Pieces · " + bits.join(" · ");
})();
</script>
